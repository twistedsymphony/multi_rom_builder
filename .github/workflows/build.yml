name: Build Multi Builder
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Self-test (from source)
        run: python tests/selftest.py
      - name: Build
        run: python -m PyInstaller --noconfirm MultiBuilder.spec
      - name: Self-test (compiled program)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then BIN=dist/MultiBuilder.app/Contents/MacOS/MultiBuilder
          elif [ "${{ runner.os }}" = "Windows" ]; then BIN=dist/MultiBuilderCLI.exe
          else BIN=dist/MultiBuilder; fi
          python tests/selftest.py --program "$BIN"
      - name: Package one build-tools zip per kit
        shell: bash
        run: |
          mkdir -p packages
          for kit in kits/*/; do
            k=$(basename "$kit")
            rm -rf "stage/$k" && mkdir -p "stage/$k"
            cp -R "$kit"/. "stage/$k/"
            if [ "${{ runner.os }}" = "macOS" ]; then cp -R dist/MultiBuilder.app "stage/$k/"
            elif [ "${{ runner.os }}" = "Windows" ]; then cp dist/MultiBuilder.exe dist/MultiBuilderCLI.exe "stage/$k/"
            else cp dist/MultiBuilder "stage/$k/"; fi
            if [ "${{ runner.os }}" = "Windows" ]; then (cd stage && 7z a -tzip "../packages/${k}_build_tools_${{ matrix.name }}.zip" "$k" > /dev/null)
            else (cd stage && zip -qry "../packages/${k}_build_tools_${{ matrix.name }}.zip" "$k"); fi
          done
          ls -l packages
      - uses: actions/upload-artifact@v4
        with:
          name: MultiBuilder-${{ matrix.name }}
          path: packages/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*.zip
